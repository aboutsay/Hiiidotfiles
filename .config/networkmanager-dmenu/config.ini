[dmenu]
# بدل rofi بالـ launcher بتاعك لو بتستخدم wofi أو fuzzel
dmenu_command = rofi -dmenu -i -theme gruvbox-dark
active_chars = ==
highlight = True
compact = False

# الرموز بتاعة الـ Wi-Fi (متأكد إنك مثبت Nerd Fonts)
wifi_chars = 󰤯󰤟󰤢󰤥󰤨

# الفورمات النضيف
format = {bars}  {name}  {sec}
list_saved = True
prompt = 󰖩 Connect

[dmenu_passphrase]
# خليه True عشان الـ privacy
obscure = True
obscure_color = #222222

# ده عشان يفتح الباسورد في التيرمينال بتاعك (افترضت إنك بتستخدم kitty)
show_pass = kitty --class floating -e nmcli device wifi show-password

[pinentry]
description = Get network password
prompt = Password:

[editor]
# غير xterm للـ terminal بتاعك (زي kitty أو foot)
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
show_notifications = True
