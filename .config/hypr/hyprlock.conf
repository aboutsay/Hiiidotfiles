background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 2
    brightness = 0.7
    vibrancy = 0.15
    vibrancy_darkness = 0.3
}

clock {
    monitor =
    text = $TIME
    font_size = 90
    font_family = JetBrains Mono Light
    color = rgba(ffb347ff)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A  %d  %b  %Y"
    font_size = 12
    font_family = JetBrains Mono
    color = rgba(e08040aa)
    position = 0, 170
    halign = center
    valign = center
}

image {
    monitor =
    path = /var/lib/AccountsService/icons/$USER
    size = 56
    rounding = -1
    border_size = 2
    border_color = rgba(ffb347cc)
    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 13
    font_family = JetBrains Mono
    color = rgba(ffb347bb)
    position = 0, -80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 220, 36
    outline_thickness = 1
    outer_color = rgba(ffb347aa)
    inner_color = rgba(1a0a0000)
    font_color = rgba(ffb347ff)
    check_color = rgba(ffd580ff)
    fail_color = rgba(f38ba8ff)
    dots_size = 0.26
    dots_spacing = 0.15
    dots_center = true
    placeholder_text = 
    fade_on_empty = true
    position = 0, -135
    halign = center
    valign = center
}

label {
    monitor =
    text = press enter to unlock
    font_size = 11
    font_family = JetBrains Mono
    color = rgba(e0804055)
    position = 0, -188
    halign = center
    valign = center
}
